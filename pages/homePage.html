<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager Dashboard</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../CSS/main.css">
</head>

<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h3><i class="fa-solid fa-list-check"></i> Task Manager</h3>
        </div>

        <ul class="nav flex-column">
            <li><a class="nav-link active"><i class="fa fa-home"></i> Dashboard</a></li>
            <li><a class="nav-link"><i class="fa fa-plus"></i> Add Task</a></li>
            <li><a class="nav-link"><i class="fa fa-list"></i> My Tasks</a></li>
            <li><a class="nav-link"><i class="fa fa-folder"></i> Categories</a></li>
            <li><a class="nav-link"><i class="fa fa-filter"></i> Filter Tasks</a></li>
            <li><a class="nav-link"><i class="fa fa-chart-line"></i> Analytics</a></li>
            <li><a class="nav-link"><i class="fa fa-gear"></i> Settings</a></li>
        </ul>

        <div class="user-info d-flex align-items-center">
            <div class="avatar" id="sidebarAvatar">JD</div>
            <div class="user-details">
                <h6 id="sidebarUsername">John Doe</h6>
                <small id="sidebarEmail">john@example.com</small>
            </div>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <main>
        <h2 class="mb-4">Dashboard <span id="welcomeUsername"></span></h2>

        <!-- STAT CARDS -->
        <div class="row">
            <div class="col-md-3">
                <div class="stat-card total-tasks">
                    <div class="card-body">
                        <div class="card-title">Total Tasks</div>
                        <div class="card-text">0</div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card completed-tasks">
                    <div class="card-body">
                        <div class="card-title">Completed</div>
                        <div class="card-text">0</div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card pending-tasks">
                    <div class="card-body">
                        <div class="card-title">Pending</div>
                        <div class="card-text">0</div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="stat-card upcoming-tasks">
                    <div class="card-body">
                        <div class="card-title">Upcoming Due</div>
                        <div class="card-text">0</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- LOWER SECTION -->
        <div class="row mt-4">
            <div class="col-md-8">
                <div class="card p-3">
                    <h5>Recent Tasks</h5>
                    <p class="text-muted">No tasks available</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Quick Actions</h5>
                    <button class="btn btn-primary mt-2"><i class="fa fa-plus"></i> Add New Task</button>
                    <button class="btn btn-secondary mt-2"><i class="fa fa-list"></i> View All Tasks</button>
                    <button class="btn btn-info text-white mt-2"><i class="fa fa-chart-line"></i> View
                        Analytics</button>
                </div>
            </div>
        </div>
    </main>

</body>

</html>


<script>
    document.addEventListener('DOMContentLoaded', function () {

        /* ===============================
        USER SETUP
        =============================== */
        let currentUser = JSON.parse(localStorage.getItem('currentUser'));


        if (!currentUser) {
            currentUser = {
                id: 1,
                username: 'John Doe',
                email: 'john@example.com',
                createdAt: new Date().toISOString(),
                loginCount: 1
            };
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
        }

        // Update sidebar & welcome text
        document.getElementById('sidebarUsername').textContent = currentUser.username;
        document.getElementById('sidebarEmail').textContent = currentUser.email;
        document.getElementById('welcomeUsername').textContent = currentUser.username;
        document.getElementById('sidebarAvatar').textContent = getInitials(currentUser.username);
        function getInitials(name) {
            return name.split(' ').map(n => n[0].toUpperCase()).join('');
        }

        /* ===============================
        TASK STORAGE INIT
        =============================== */
        if (!localStorage.getItem('taskManagerTasks')) {
            localStorage.setItem('taskManagerTasks', JSON.stringify([]));
        }

        updateTaskStats(currentUser.id);

        /* ===============================
        LOGOUT
        =============================== */
        document.getElementById('logoutBtn').addEventListener('click', function () {
            localStorage.removeItem('currentUser');
            showAlert('info', 'Logged out successfully');
            setTimeout(() => {
                location.reload();
            }, 1000);
        });

        /* ===============================
        ADD SAMPLE TASK
        =============================== */
        document.getElementById('addSampleTaskBtn').addEventListener('click', function () {

            const tasks = JSON.parse(localStorage.getItem('taskManagerTasks'));

            const sampleTask = {
                id: Date.now(),
                userId: currentUser.id,
                title: 'Sample Task ' + (tasks.filter(t => t.userId === currentUser.id).length + 1),
                description: 'This is a sample task description',
                category: 'Personal',
                priority: 'Medium',
                dueDate: new Date(Date.now() + 7 * 24 * 60 * 60 * 1000)
                    .toISOString().split('T')[0],
                completed: false,
                createdAt: new Date().toISOString()
            };

            tasks.push(sampleTask);
            localStorage.setItem('taskManagerTasks', JSON.stringify(tasks));

            updateTaskStats(currentUser.id);
            showAlert('success', 'Sample task added successfully!');
        });

        /* ===============================
        VIEW PROFILE
        =============================== */
        document.getElementById('viewProfileBtn').addEventListener('click', function () {
            showAlert(
                'info',
                `Username: ${currentUser.username}<br>
    Email: ${currentUser.email}<br>
    Created: ${new Date(currentUser.createdAt).toLocaleDateString()}<br>
    Login Count: ${currentUser.loginCount}`
            );
        });

        /* ===============================
        SIDEBAR NAVIGATION
        =============================== */
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();

                document.querySelectorAll('.nav-link').forEach(item => {
                    item.classList.remove('active');
                });

                this.classList.add('active');

                const page = this.getAttribute('data-page');
                showAlert('info', `Loading ${page.replace('-', ' ')}...`);
            });
        });

        /* ===============================
        FUNCTIONS
        =============================== */
        function updateTaskStats(userId) {
            const tasks = JSON.parse(localStorage.getItem('taskManagerTasks')) || [];
            const userTasks = tasks.filter(task => task.userId === userId);

            const totalTasks = userTasks.length;
            const completedTasks = userTasks.filter(task => task.completed).length;
            const pendingTasks = totalTasks - completedTasks;

            document.getElementById('totalTasks').textContent = totalTasks;
            document.getElementById('completedTasks').textContent = completedTasks;
            document.getElementById('pendingTasks').textContent = pendingTasks;
        }

        function showAlert(type, message) {
            const successAlert = document.getElementById('successAlert');
            const errorAlert = document.getElementById('errorAlert');

            successAlert.classList.add('hidden');
            errorAlert.classList.add('hidden');

            if (type === 'success' || type === 'info') {
                successAlert.className = `alert alert-${type}`;
                document.getElementById('alertMessage').innerHTML = message;
                successAlert.classList.remove('hidden');

                setTimeout(() => {
                    successAlert.classList.add('hidden');
                }, 3000);
            }

            if (type === 'error') {
                document.getElementById('errorMessage').innerHTML = message;
                errorAlert.classList.remove('hidden');

                setTimeout(() => {
                    errorAlert.classList.add('hidden');
                }, 3000);
            }
        }

    });
</script>

</body>

</html>
