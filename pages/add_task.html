<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/add.css">
</head>

<body>
    <!-- Login Page -->
    <div id="login-page" class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <h2><i class="fas fa-tasks"></i> Task Manager</h2>
                    <p>Please login to continue</p>
                </div>
                <div class="login-body">
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="login-name" class="form-label">Your Name</label>
                            <input type="text" class="form-control" id="login-name" placeholder="Enter your name"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="login-email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="login-email" placeholder="Enter your email"
                                required>
                        </div>
                        <div class="mb-4">
                            <label for="login-theme" class="form-label">Preferred Theme</label>
                            <select class="form-select" id="login-theme">
                                <option value="light">Light Mode</option>
                                <option value="dark">Dark Mode</option>
                                <option value="auto">Auto (System)</option>
                            </select>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt"></i> Login / Register
                            </button>
                        </div>
                        <div class="login-footer mt-3">
                            <small class="text-muted">Your data will be saved in your browser's local storage</small>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App Container (hidden initially) -->
    <div id="app-container" class="container-fluid" style="display: none;">
        <!-- Rest of your existing HTML code here -->
        <!-- Keep all the existing content from the previous HTML -->
    </div>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar Navigation -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar">
                <div class="sidebar-sticky">
                    <div class="sidebar-header">
                        <h3><i class="fas fa-tasks"></i> Task Manager</h3>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#" data-page="dashboard">
                                <i class="fas fa-home"></i> Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="add-task">
                                <i class="fas fa-plus-circle"></i> Add Task
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="my-tasks">
                                <i class="fas fa-tasks"></i> My Tasks
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="categories">
                                <i class="fas fa-folder"></i> Categories
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="filter">
                                <i class="fas fa-filter"></i> Filter Tasks
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="analytics">
                                <i class="fas fa-chart-bar"></i> Analytics
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" data-page="settings">
                                <i class="fas fa-cog"></i> Settings
                            </a>
                        </li>
                        <li class="nav-item mt-5">
                            <a class="nav-link logout-btn" href="#" id="logout">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </a>
                        </li>
                    </ul>
                    <div class="user-info mt-auto">
                        <div class="d-flex align-items-center">
                            <div class="avatar">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="user-details">
                                <h6>John Doe</h6>
                                <small>john@example.com</small>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4" id="main-content">
                

                <!-- Add Task Page -->
                <div class="page" id="add-task-page">
                    <div
                        class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                        <h1 class="h2"><i class="fas fa-plus-circle"></i> Add New Task</h1>
                    </div>

                    <div class="add-task-form">
                        <div class="card">
                            <div class="card-body">
                                <form id="task-form">
                                    <div class="mb-3">
                                        <label for="task-title" class="form-label">Title *</label>
                                        <input type="text" class="form-control" id="task-title" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="task-description" class="form-label">Description</label>
                                        <textarea class="form-control" id="task-description" rows="3"></textarea>
                                    </div>

                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="task-category" class="form-label">Category</label>
                                            <select class="form-select" id="task-category">
                                                <option value="Work">Work</option>
                                                <option value="Personal">Personal</option>
                                                <option value="Study">Study</option>
                                                <option value="Health">Health</option>
                                                <option value="Finance">Finance</option>
                                                <option value="Other">Other</option>
                                            </select>
                                        </div>

                                        <div class="col-md-6 mb-3">
                                            <label for="task-priority" class="form-label">Priority</label>
                                            <select class="form-select" id="task-priority">
                                                <option value="Low">Low</option>
                                                <option value="Medium">Medium</option>
                                                <option value="High">High</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="task-due-date" class="form-label">Due Date</label>
                                        <input type="text" class="form-control" id="task-due-date"
                                            placeholder="Select date">
                                    </div>

                                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                        <button type="button" class="btn btn-secondary me-md-2"
                                            id="cancel-task">Cancel</button>
                                        <button type="submit" class="btn btn-primary">Add Task</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../JS/add_task.js"></script>
</body>

</html>
